[project]
name = "virtual-context-memory"
version = "0.1.0"
description = "OS-style paging for an agent's context window: core blocks, a message queue, recall and archival storage, pluggable eviction policies and a LoCoMo replay benchmark."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Lopez" }]
requires-python = ">=3.12,<3.13"
keywords = ["memory", "context-window", "paging", "arc", "lru", "bm25", "mcp", "agents"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.0",
    "numpy>=2.0",
    "onnxruntime>=1.19",
    "pydantic>=2.7",
    "starlette>=0.40",
    "tokenizers>=0.20",
    "typer>=0.19",
]

[project.scripts]
vcmem = "vcmem.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcmem"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "TC"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT018"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = [
    "integration: needs the downloaded LoCoMo data or the ONNX model (run with -m integration)",
]
